<!-- Navigation Component -->
<style>
/* Fallback CSS for responsive navigation when external CSS fails to load */
.mobile-menu-fallback {
    /* Default: hide desktop nav on mobile */
    display: none;
}

.mobile-btn-fallback {
    /* Default: show mobile button */
    display: inline-block;
}

.mobile-menu-container-fallback {
    /* Default: hide mobile menu */
    display: none;
}

.mobile-menu-container-fallback.show {
    /* Show mobile menu when toggled */
    display: block;
}

/* Hamburger icon fallback using CSS */
.hamburger-icon-fallback {
    display: inline-block;
    width: 20px;
    height: 16px;
    position: relative;
    cursor: pointer;
}

.hamburger-icon-fallback::before,
.hamburger-icon-fallback::after,
.hamburger-icon-fallback span {
    content: '';
    display: block;
    height: 2px;
    width: 100%;
    background-color: #4B5563;
    position: absolute;
    left: 0;
    transition: all 0.3s;
}

.hamburger-icon-fallback::before {
    top: 0;
}

.hamburger-icon-fallback span {
    top: 7px;
}

.hamburger-icon-fallback::after {
    top: 14px;
}

/* Desktop breakpoint */
@media (min-width: 768px) {
    .mobile-menu-fallback {
        /* Show desktop nav on desktop */
        display: flex !important;
    }
    
    .mobile-btn-fallback {
        /* Hide mobile button on desktop */
        display: none !important;
    }
    
    .mobile-menu-container-fallback {
        /* Always hide mobile menu on desktop */
        display: none !important;
    }
}

/* Base navigation styling fallback */
nav.nav-fallback {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    background-color: rgba(255, 255, 255, 0.95);
    border-bottom: 1px solid rgba(229, 231, 235, 0.5);
    z-index: 50;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
}

.nav-container-fallback {
    max-width: 80rem;
    margin: 0 auto;
    padding: 0 1rem;
}

.nav-header-fallback {
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 4rem;
}

.nav-logo-fallback {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    text-decoration: none;
    color: #111827;
    font-weight: 700;
    font-size: 1.25rem;
}

.nav-logo-icon-fallback {
    width: 2rem;
    height: 2rem;
    background: linear-gradient(to right, #2563eb, #7c3aed);
    border-radius: 0.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 0.875rem;
}

.nav-links-fallback {
    display: flex;
    align-items: center;
    gap: 2rem;
}

.nav-links-fallback a {
    color: #4B5563;
    font-weight: 500;
    text-decoration: none;
    transition: color 0.2s;
}

.nav-links-fallback a:hover {
    color: #2563eb;
}

.mobile-nav-fallback {
    background-color: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-top: 1px solid rgba(229, 231, 235, 0.5);
    padding: 0.5rem;
}

.mobile-nav-fallback a {
    display: block;
    padding: 0.75rem;
    color: #4B5563;
    font-weight: 500;
    text-decoration: none;
    transition: color 0.2s;
}

.mobile-nav-fallback a:hover {
    color: #2563eb;
}

.mobile-btn-fallback {
    background: none;
    border: none;
    color: #4B5563;
    cursor: pointer;
    padding: 0.5rem;
    transition: color 0.2s;
}

.mobile-btn-fallback:hover {
    color: #111827;
}
</style>

<nav class="fixed top-0 left-0 right-0 bg-white/90 glassmorphism border-b border-gray-200/50 z-50 transition-all duration-300 nav-fallback">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 nav-container-fallback">
        <div class="flex justify-between items-center h-16 nav-header-fallback">
            <!-- Logo -->
            <div class="flex items-center">
                <a href="home.html" class="flex items-center space-x-2 nav-logo-fallback" id="logo-link">
                    <div class="w-8 h-8 bg-gradient-to-r from-blue-600 to-purple-600 rounded-lg flex items-center justify-center nav-logo-icon-fallback">
                        <i class="fa-solid fa-bolt text-white text-sm"></i>
                        <!-- Fallback if Font Awesome doesn't load -->
                        <span style="display: none;">⚡</span>
                    </div>
                    <span class="font-display font-bold text-xl text-gray-900">Digital Dash</span>
                </a>
            </div>
            
            <!-- Desktop Navigation -->
            <div class="hidden md:flex items-center space-x-8 mobile-menu-fallback nav-links-fallback">
                <a href="home.html" class="nav-link text-gray-600 hover:text-blue-600 transition-colors duration-200 font-medium" data-page="home">Home</a>
                <a href="dash.html" class="nav-link text-gray-600 hover:text-blue-600 transition-colors duration-200 font-medium" data-page="dash">Tools</a>
                <a href="sme.html" class="nav-link text-gray-600 hover:text-blue-600 transition-colors duration-200 font-medium" data-page="sme">Business Tools</a>
                <a href="returns.html" class="nav-link text-gray-600 hover:text-blue-600 transition-colors duration-200 font-medium" data-page="returns">Compliance</a>
            </div>
            
            <!-- Mobile menu button -->
            <div class="md:hidden mobile-btn-fallback">
                <button onclick="toggleMobileMenu()" class="text-gray-600 hover:text-gray-900 focus:outline-none mobile-btn-fallback">
                    <i class="fa-solid fa-bars text-xl"></i>
                    <!-- Fallback hamburger icon if Font Awesome doesn't load -->
                    <span class="hamburger-icon-fallback" style="display: none;">
                        <span></span>
                    </span>
                </button>
            </div>
        </div>
        
        <!-- Mobile Navigation Menu -->
        <div id="mobile-menu" class="hidden md:hidden bg-white/95 glassmorphism border-t border-gray-200/50 mobile-menu-container-fallback mobile-nav-fallback">
            <div class="px-2 pt-2 pb-3 space-y-1">
                <a href="home.html" class="mobile-nav-link block px-3 py-2 text-gray-600 hover:text-blue-600 font-medium" data-page="home">Home</a>
                <a href="dash.html" class="mobile-nav-link block px-3 py-2 text-gray-600 hover:text-blue-600 font-medium" data-page="dash">Tools</a>
                <a href="sme.html" class="mobile-nav-link block px-3 py-2 text-gray-600 hover:text-blue-600 font-medium" data-page="sme">Business Tools</a>
                <a href="returns.html" class="mobile-nav-link block px-3 py-2 text-gray-600 hover:text-blue-600 font-medium" data-page="returns">Compliance</a>
            </div>
        </div>
    </div>
</nav>
